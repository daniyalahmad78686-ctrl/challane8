<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>

<body>
    <h2 class="d-flex justify-content-center mt-6">Login and Signup Modals</h2>
    <p class="d-flex justify-content-center">Interactive modals built with 100% pure HTML and CSS.</p>
    <button type="button" class="btn-solid theme-primary" data-bs-toggle="dialog" data-bs-target="#exampleDialog" style="margin-left: 38rem;">
        Log In
    </button>

    <dialog class="dialog" id="exampleDialog">
        <div class="dialog-header">
            <h1 class="dialog-title">Welcome Back</h1>
            <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
        </div>
        <div class="dialog-body">
            <div class="form-field">
                <label for="exampleFormControlInput1" class="form-label">Email address</label>
                <input type="email" class="form-control" id="exampleFormControlInput1" placeholder="name@example.com">
                <label for="exampleFormControlInput1" class="form-label">Password</label>
                <input type="password" class="form-control" id="exampleFormControlInput1" placeholder=". . . . . .">
            </div>
        </div>
        <div class="dialog-footer">
            <button class="btn" style="width: 40rem; background-color: #0f172a; color:white;">Log In</button>
        </div>
    </dialog>

    <button type="button" class="btn-solid theme-primary my-10" data-bs-toggle="dialog" data-bs-target="#signupDialog">
        Sign Up
    </button>

    <dialog class="dialog" id="signupDialog">
        <div class="dialog-header">
            <h1 class="dialog-title">Create an Account</h1>
            <button type="button" class="btn-close" data-bs-dismiss="dialog" aria-label="Close"></button>
        </div>

        <div class="dialog-body">
            <div class="form-field">
                <label class="form-label">Full Name</label>
                <input type="text" class="form-control" placeholder="Enter your name">

                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" placeholder="name@example.com">

                <label class="form-label">Password</label>
                <input type="password" class="form-control" placeholder="Create a password">
            </div>
        </div>

        <div class="dialog-footer">
            <button class="btn" style="width: 40rem; background-color: #0f172a; color:white;">
                Sign Up
            </button>
        </div>
    </dialog>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</body>

</html>
